name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Upstream compatibility lane: DeepSeek Harness's APIs are pre-stable, so this discovers a
    # breaking change before a user reports it. Advisory; it does not block a release.
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  unit:
    name: unit, protocol, security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix companion
      # Companion, extension (checkJs), and the test tree — the harness included.
      - run: npm run typecheck
      - run: npm run build
      # The POSIX permission case is skipped on Windows; this is where it actually runs.
      - run: npm run test:unit

  e2e:
    name: real browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix companion
      - run: npx playwright install --with-deps chromium
      # The shipped page module in the full browser's new headless mode.
      - run: npm run test:page
      # The extension tests run headed, as users run it: under a virtual display on Linux, on the
      # runner's desktop session on Windows. (DSH_E2E_HEADLESS=1 would run them in the full browser's
      # new headless mode instead.) The released-pair suite skips here, saying so; the released-pair
      # job runs it against the packaged artifacts and a real dsh.
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum -- npm run test:e2e
      - if: runner.os != 'Linux'
        run: npm run test:e2e

  package:
    name: package and verify
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --prefix companion
      - run: npm run build
      - run: node scripts/package.mjs --out dist
      - run: node scripts/verify-package.mjs --dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            dist/*.zip
            dist/*.tgz
            dist/SHA256SUMS
            dist/release-manifest.json

  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [unit]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --prefix companion
      - run: npm run build
      - run: mkdir -p dist && cd companion && npm pack --pack-destination ../dist
      # `dsh plugin` forwards to pnpm, which DeepSeek Harness does not install for its users and the
      # runner images do not promise.
      - run: npm install -g pnpm
      - name: install a real dsh into a scratch directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-int" && cd "$RUNNER_TEMP/dsh-int" && npm init -y >/dev/null
          npm install "@deepseek-ai/dsh@latest" --no-audit --no-fund
      # Runner paths contain no spaces, so the Windows 8.3 short-path workaround in install.ps1 is
      # exercised locally (docs/TEST-EVIDENCE.md) rather than here. The other expectations — fresh
      # install, bundle registration, broker liveness, upgrade with a stable pairing code, and a
      # clean uninstall — are what these jobs prove per platform.
      - name: fresh install, upgrade, uninstall (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x tests/installer/linux-installer.sh
          tests/installer/linux-installer.sh "$PWD"/dist/corsen-ai-dsh-browser-connector-*.tgz "$RUNNER_TEMP/dsh-int/node_modules/.bin"
      - name: fresh install, upgrade, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tgz = (Get-ChildItem dist\corsen-ai-dsh-browser-connector-*.tgz | Select-Object -First 1).FullName
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\installer\windows-installer.ps1 -Tarball $tgz -DshBin "$env:RUNNER_TEMP\dsh-int\node_modules\.bin"
          exit $LASTEXITCODE

  released-pair:
    name: released pair in a real DeepSeek Harness (${{ matrix.lane }})
    runs-on: ubuntu-latest
    needs: [package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: released
            spec: "@deepseek-ai/dsh@latest"
          - lane: next
            spec: "@deepseek-ai/dsh@next"
          # The lowest version the connector declares (engines.dsh and SUPPORTED_DSH.minimum).
          - lane: minimum
            spec: "@deepseek-ai/dsh@0.1.2-rc.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix companion
      - run: npx playwright install --with-deps chromium
      # `dsh plugin` forwards to pnpm, which DeepSeek Harness does not install for its users.
      - run: npm install -g pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist
      - name: install a real dsh into a scratch directory, with DeepSeek Harness's own mock provider of the same version beside it
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-pair" && cd "$RUNNER_TEMP/dsh-pair" && npm init -y >/dev/null
          version="$(npm view "${{ matrix.spec }}" version | tail -1)"
          npm install "@deepseek-ai/dsh@$version" "@deepseek-ai/dsh-llm-mock-server@$version" --no-audit --no-fund
          ./node_modules/.bin/dsh --version
      # Gate AQ: the packaged tarball into that dsh, the packaged ZIP into Chromium, the broker as
      # its own process from the installation, killed and restarted. Nothing from companion/src/.
      # Gate Y: one live turn of a real dsh process, its model answered by DeepSeek Harness's own
      # scripted mock provider, the tool call executed through the released pair.
      - run: DSH_BIN_DIR="$RUNNER_TEMP/dsh-pair/node_modules/.bin" xvfb-run --auto-servernum -- node --test --test-concurrency=1 --test-force-exit --experimental-strip-types tests/e2e/released-pair.test.ts tests/e2e/live-turn.test.ts

  provenance:
    name: provenance audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The references are fetched at the exact SHAs recorded in docs/PROVENANCE.md, so the audit
      # in CI compares against the same baselines the document describes.
      - name: fetch the reference repositories at their pinned baselines
        run: |
          fetch() { mkdir -p ".refs/$1" && cd ".refs/$1" && git init -q && git remote add origin "$2" && git fetch -q --depth 1 origin "$3" && git checkout -q FETCH_HEAD && cd - >/dev/null; }
          fetch dsh-browser https://github.com/Lum1104/dsh-browser.git e60e6e3f589205a5755b35f234155d3ec17d030b
          fetch hermes-connector https://github.com/CorsenAI/hermes-connector.git bfd9bc29718c4647a1438962aae28ed4d1220df6
      # Ceilings: a copied function exceeds 32 exact tokens at once; a rewritten module raises
      # coverage well past 2%. Both are far above what the recorded audit measured.
      - run: node scripts/provenance-audit.mjs --exact 16 --shape 40 --max-run 32 --max-coverage 2 --json provenance-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance-audit
          path: provenance-audit.json

  dsh-integration:
    name: real DeepSeek Harness (${{ matrix.lane }})
    runs-on: ubuntu-latest
    needs: [unit]
    # The upstream lane may break at any time by design; only the released lanes gate a release.
    continue-on-error: ${{ matrix.lane == 'upstream' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: released
            spec: "@deepseek-ai/dsh@latest"
          - lane: next
            spec: "@deepseek-ai/dsh@next"
          - lane: upstream
            spec: "github:deepseek-ai/deepseek-harness"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --prefix companion
      - run: npm run build
      - run: mkdir -p dist && cd companion && npm pack --pack-destination ../dist
      # `dsh plugin` forwards to pnpm (see the installer job).
      - run: npm install -g pnpm
      - name: install dsh and the packaged connector
        run: |
          mkdir -p /tmp/dsh-int && cd /tmp/dsh-int && npm init -y >/dev/null
          npm install "${{ matrix.spec }}" --no-audit --no-fund
          export DSH_HOME=/tmp/dsh-int/home
          ./node_modules/.bin/dsh plugin --profile headless add "$GITHUB_WORKSPACE"/dist/corsen-ai-dsh-browser-connector-*.tgz
          ./node_modules/.bin/dsh --profile headless --dump-config | tee config.yml
          grep -q "corsen-browser-connector" config.yml
      - name: the plugin applies without error
        run: |
          cd /tmp/dsh-int && export DSH_HOME=/tmp/dsh-int/home
          set +e
          ./node_modules/.bin/dsh --profile headless "say hi" > out.txt 2>&1
          set -e
          # The only acceptable failure is the missing API key. Anything from the connector is a
          # real failure.
          if grep -q "corsen-browser-connector" out.txt; then cat out.txt; exit 1; fi
          grep -q "MISSING_CREDENTIAL\|API key" out.txt
