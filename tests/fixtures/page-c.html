<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connector fixture C</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  #spacer { height: 3000px; background: linear-gradient(#fff, #ddd); }
  #dropzone { width: 200px; height: 80px; border: 2px dashed #888; }
  #tooltip { display: none; }
  #hover-target:hover + #tooltip, #tooltip.shown { display: block; }
</style>
</head>
<body>
  <h1>Fixture C — controls</h1>
  <p id="outcome">untouched</p>

  <!-- key: a handler that records the last key, and a form that records implicit submission. -->
  <form id="search" onsubmit="event.preventDefault(); document.getElementById('outcome').textContent = 'submitted:' + this.q.value;">
    <label for="q">Search</label>
    <input id="q" name="q" type="text" value="" onkeydown="document.getElementById('last-key').textContent = event.key + (event.ctrlKey ? '+ctrl' : '');">
  </form>
  <p id="last-key">none</p>
  <div id="escape-target" tabindex="0" onkeydown="if (event.key === 'Escape') document.getElementById('outcome').textContent = 'escaped';">Press Escape here</div>

  <!-- select_option -->
  <label for="colour">Colour</label>
  <select id="colour" name="colour" onchange="document.getElementById('outcome').textContent = 'colour:' + this.value;">
    <option value="r">Red</option>
    <option value="g" selected>Green</option>
    <option value="b">Blue</option>
  </select>

  <!-- hover -->
  <button id="hover-target" type="button" onmouseover="document.getElementById('tooltip').classList.add('shown'); document.getElementById('outcome').textContent = 'hovered';">Hover me</button>
  <div id="tooltip">Tooltip revealed</div>

  <!-- drag: HTML5 drag-and-drop with a data transfer, and the outcome written on drop. -->
  <div id="draggable" draggable="true" ondragstart="event.dataTransfer.setData('text/plain', 'payload-42');">Drag me</div>
  <div id="dropzone" ondragover="event.preventDefault();" ondrop="event.preventDefault(); document.getElementById('outcome').textContent = 'dropped:' + event.dataTransfer.getData('text/plain');">Drop here</div>

  <!-- recovery: a submission that takes a while, so a component can die while it runs. The handler
       blocks the page for 1.5 s and counts how many times it ran; a replayed action shows up as 2. -->
  <form id="slow-form" onsubmit="event.preventDefault(); const end = Date.now() + 1500; while (Date.now() < end) {} this.dataset.submissions = String(Number(this.dataset.submissions || 0) + 1); document.getElementById('outcome').textContent = 'slow submitted ' + this.dataset.submissions;">
    <label for="slow">Slow field</label>
    <input id="slow" name="slow" type="text" value="">
  </form>

  <!-- navigate/back/forward -->
  <a id="to-a" href="page-a.html">Go to fixture A</a>

  <!-- find + scroll: a marker far down the page. -->
  <div id="spacer"></div>
  <p id="deep">The needle in the haystack is here at the bottom.</p>
  <button id="bottom-button" type="button" onclick="document.getElementById('outcome').textContent = 'bottom clicked';">Bottom button</button>

  <script>
    // wait: a late mutation the settle logic must outlast.
    setTimeout(() => { document.getElementById('outcome').dataset.late = 'arrived'; }, 400);
  </script>
</body>
</html>
